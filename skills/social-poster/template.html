<!doctype html>
<!--
  alifs-3d-agent poster template: the "drawing sheet" (passes Hallmark's sloplint as shipped).
  Copy to <workspace>/posters/<name>.html, then replace every {{...}} and re-measure every MEASURE.
  export_poster.py sets <html data-size="feed|story|facebook"> and injects the fonts.
  Rules: social-poster SKILL.md and Hallmark (~/.claude/skills/hallmark). Run sloplint before export.
-->
<html lang="en" data-size="feed">
<head>
<meta charset="utf-8">
<title>{{PRODUCT}}</title>
<meta name="description" content="{{ONE SENTENCE ABOUT THE PRODUCT}}">
<style>
/* Hallmark · shape: drawing sheet · genre: modern-minimal · theme: brand (Borgo Labs, by request)
 * paper: oklch(0.18 0.008 260) · accent: oklch(0.67 0.15 55) · display: Space Grotesk · body: Inter · hero: full-bleed render, cropped so the shade hangs from the top edge · nav: none (poster) · footer: title block · signature: {{THE ONE MOVE, e.g. the real dimension drawn on the render}}
 * axes: dark/grotesk-sans/warm · posture: restrained · contrast: pass · fold: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P_ H_ E_ S_ R_ V_ · weakest: _, {{what you did about it}} */
/* Hallmark · dismissed F16 · a fixed-size poster exported to PNG has no selection or scrollbar */
/* Hallmark · waive 37 · .price .tk · Hind Siliguri sets only the taka sign, a Bengali character the Latin faces do not have */
/* Hallmark · waive 26b · .cta · the poster is exported to PNG, so nothing on it can be pressed */
:root {
  --color-paper: #101216;      /* MEASURE: sample the opaque render's background so photo and sheet are one surface */
  --color-ink: #F4F2EC;        /* Paper */
  --color-ink-2: #D9D6CE;
  --color-muted: #9A9690;
  --color-accent: #D97B2C;     /* Molten Copper: headline */
  --color-rule: #E0995A;       /* Copper 300: thin rules and the dimension */
  --color-rule-quiet: #2A2B30;
  --color-accent-ink: #0A0A0B; /* Ink: text on the copper button */
  --font-display: "Space Grotesk", "Inter", sans-serif;
  --font-body: "Inter", sans-serif;
  --font-figure: "JetBrains Mono", monospace;
  --font-bangla: "Hind Siliguri", sans-serif; /* the taka sign is a Bengali character */
  --price: 48px;
  --cta: 18px;
  --logo-w: 200px;
  --logo-y: 48px;

  /* per-size knobs, feed defaults (1080 x 1350). MEASURE: move --vx/--vy/--vw until the product sits right */
  --view-h: 968px;             /* photo band height */
  --vw: 1180px;                /* render width; the 4:5 render is scaled, not cropped by object-fit */
  --vx: -50px;
  --vy: -404px;
  --pad: 56px;
  --h1: 56px;
  --lead: 24px;
  --dt: 16px;
  --dd: 22px;
  --dim: 22px;
}
html[data-size="story"] {     /* 1080 x 1920, top 250 and bottom 340 kept free of text */
  --view-h: 1232px; --vw: 1300px; --vx: -110px; --vy: -300px;
  --h1: 64px; --lead: 26px; --dt: 16px; --dd: 24px; --dim: 24px;
  --price: 52px; --cta: 20px; --logo-w: 220px; --logo-y: 268px;
}
html[data-size="facebook"] {  /* 1200 x 630, render left, sheet right */
  --vw: 688px; --vx: -64px; --vy: -204px;
  --pad: 48px; --h1: 44px; --lead: 20px; --dt: 13px; --dd: 17px; --dim: 16px;
  --price: 36px; --cta: 15px; --logo-w: 140px; --logo-y: 32px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: clip; }
body { background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
h1, p, dl, dd { margin: 0; }
:focus-visible { outline: 2px solid var(--color-rule); outline-offset: 2px; }

.sheet { display: grid; grid-template-rows: var(--view-h) auto; height: 100%; }
html[data-size="story"] .sheet { grid-template-rows: var(--view-h) auto minmax(0, 1fr); }
html[data-size="facebook"] .sheet { grid-template-rows: none; grid-template-columns: 560px minmax(0, 1fr); }

/* the view: the render at a fixed scale, the dimension drawn in its own coordinates */
.view { position: relative; overflow: clip; min-width: 0; }
.render { position: absolute; left: var(--vx); top: var(--vy); width: var(--vw); aspect-ratio: 4 / 5; }
.render img { display: block; width: 100%; height: 100%; }
/* MEASURE on the transparent render (alpha bbox per row): the widest row y%, its left/right x%, and the lowest y%.
   ext top = widest + 1.5%, dim top = lowest + ~3%. Values below are the ISSAY shade. */
.ext, .dim { position: absolute; background: var(--color-rule); }
.ext { top: 64.5%; height: 26.5%; width: 1px; }
.ext.l { left: 21.5%; }
.ext.r { left: 78.5%; }
.dim { top: 90%; left: 21.5%; width: 57%; height: 1px; }
.dim::before, .dim::after { content: ""; position: absolute; top: -8px; width: 1px; height: 16px; background: var(--color-rule); transform: rotate(45deg); }
.dim::before { left: 0; }
.dim::after { right: 0; }
.dim-label { position: absolute; top: calc(90% + 12px); left: 50%; transform: translateX(-50%);
  font: 500 var(--dim)/1 var(--font-body); font-variant-numeric: tabular-nums; color: var(--color-ink); white-space: nowrap; }

/* the title block */
.block { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); column-gap: 48px;
  padding: 40px var(--pad) 48px; border-top: 1px solid var(--color-rule); }
html[data-size="facebook"] .block { grid-template-columns: minmax(0, 1fr); align-content: center; row-gap: 28px;
  border-top: 0; border-left: 1px solid var(--color-rule); }
.title { display: grid; align-content: start; gap: 16px; }
h1 { font: 600 var(--h1)/1.04 var(--font-display); letter-spacing: -0.035em; color: var(--color-accent);
  overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
.lead { font: 400 var(--lead)/1.4 var(--font-body); color: var(--color-ink-2); max-width: 30ch; text-wrap: pretty; }
.title { grid-template-rows: auto auto 1fr; }
html[data-size="facebook"] .title { grid-template-rows: none; gap: 12px; }

/* the offer: price and where to buy */
.offer { align-self: end; display: flex; align-items: center; gap: 24px; padding-top: 8px; }
.price { font: 600 var(--price)/1 var(--font-display); letter-spacing: -0.02em; color: var(--color-ink); white-space: nowrap; }
.price .tk { font-family: var(--font-bangla); font-weight: 600; }
.cta { padding: 12px 20px; border-radius: 4px; background: var(--color-accent); color: var(--color-accent-ink);
  font: 600 var(--cta)/1.2 var(--font-body); }
.cta span { display: block; font-weight: 400; }

/* the logo: top-left on feed and story, top-right on facebook */
.sheet { position: relative; }
.logo { position: absolute; z-index: 1; width: var(--logo-w); top: var(--logo-y); left: var(--pad); }
html[data-size="facebook"] .logo { left: auto; right: var(--pad); }

.specs { display: grid; align-content: start; }
.specs div { display: grid; gap: 4px; padding: 12px 0; border-bottom: 1px solid var(--color-rule-quiet); }
.specs div:first-child { padding-top: 0; }
.specs div:last-child { border-bottom: 0; }
dt { font: 400 var(--dt)/1.2 var(--font-body); color: var(--color-muted); }
dd { font: 400 var(--dd)/1.25 var(--font-figure); color: var(--color-ink); font-variant-numeric: tabular-nums; }
dd.credit { font: 400 var(--dt)/1.4 var(--font-body); color: var(--color-ink-2); }
html[data-size="facebook"] .specs { grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 20px; }
html[data-size="facebook"] .specs div { padding: 0; border: 0; }
html[data-size="facebook"] .specs div.design { grid-column: 1 / -1; padding-top: 16px; margin-top: 16px; border-top: 1px solid var(--color-rule-quiet); }
</style>
</head>
<body>
<main class="sheet">
  <img class="logo" src="../brand/borgo-labs-logo-dark.png" alt="Borgo Labs">
  <figure class="view" style="margin:0">
    <div class="render">
      <img src="../renders/{{NAME}}_hero.png" alt="{{WHAT THE RENDER SHOWS}}">
      <span class="ext l"></span><span class="ext r"></span>
      <span class="dim"></span>
      <span class="dim-label">{{Ø145 mm}}</span>
    </div>
  </figure>
  <section class="block">
    <div class="title">
      <h1>{{HEADLINE, 7 words max}}</h1>
      <p class="lead">{{ONE SENTENCE, 12 words max}}</p>
      <div class="offer">
        <p class="price"><span class="tk" lang="bn">৳</span>{{PRICE}}</p>
        <p class="cta">Buy now<span>{{BUY LINK from brand.md}}</span></p>
      </div>
    </div>
    <dl class="specs">
      <div><dt>Size</dt><dd>{{W × H mm}}</dd></div>
      <div><dt>Material</dt><dd>{{grams from production.json}} g {{filament}}</dd></div>
      <div><dt>{{Spec}}</dt><dd>{{value}}</dd></div>
      <div class="design"><dt>Design</dt><dd class="credit">{{Design credit when it is not our own design; delete this row otherwise}}</dd></div>
    </dl>
  </section>
</main>
</body>
</html>
